diff -ruN -x '*.zip' orig/YTMusicUltimate-main/Source/PlaylistDownloader.h /home/claude/YTMusicUltimate-main/Source/PlaylistDownloader.h
--- orig/YTMusicUltimate-main/Source/PlaylistDownloader.h	1970-01-01 00:00:00.000000000 +0000
+++ /home/claude/YTMusicUltimate-main/Source/PlaylistDownloader.h	2026-11-24 22:33:49.293713331 +0000
@@ -0,0 +1,10 @@
+#import <UIKit/UIKit.h>
+#import "Headers/YTMNowPlayingViewController.h"
+
+// Downloads the currently playing track and then the following tracks in the
+// playback queue, one after another, reusing the tweak's single-track download path.
+@interface YTMUPlaylistDownloader : NSObject
+@property (nonatomic, readonly) BOOL running;
++ (instancetype)shared;
+- (void)promptAndStartFromPlayingController:(YTMNowPlayingViewController *)playingVC;
+@end
diff -ruN -x '*.zip' orig/YTMusicUltimate-main/Source/PlaylistDownloader.m /home/claude/YTMusicUltimate-main/Source/PlaylistDownloader.m
--- orig/YTMusicUltimate-main/Source/PlaylistDownloader.m	1970-01-01 00:00:00.000000000 +0000
+++ /home/claude/YTMusicUltimate-main/Source/PlaylistDownloader.m	2026-11-24 23:58:59.057093254 +0000
@@ -0,0 +1,253 @@
+#import "PlaylistDownloader.h"
+#import "FFMpegDownloader.h"
+#import "PlaylistStore.h"
+#import "Headers/YTMWatchViewController.h"
+#import "Headers/YTPlayerViewController.h"
+#import "Headers/YTIThumbnailDetails_Thumbnail.h"
+
+static const NSTimeInterval kNextTrackTimeout = 20.0; // wait this long for the next track to load
+static const NSInteger kDefaultCount = 25;
+static const NSInteger kMaxCount = 500;
+
+// Same logic as -getURLFromManifest: in Downloading.x (blocking network call, run off the main thread)
+static NSString *YTMUAudioURLFromManifest(NSString *manifestURL) {
+    NSData *data = [NSData dataWithContentsOfURL:[NSURL URLWithString:manifestURL]];
+    NSString *manifest = data ? [[NSString alloc] initWithData:data encoding:NSUTF8StringEncoding] : nil;
+    if (!manifest) return nil;
+
+    NSArray *lines = [manifest componentsSeparatedByString:@"\n"];
+    for (NSString *groupID in @[@"234", @"233"]) {
+        NSString *needle = [NSString stringWithFormat:@"TYPE=AUDIO,GROUP-ID=\"%@\"", groupID];
+        for (NSString *line in lines) {
+            if (![line containsString:needle]) continue;
+            NSRange start = [line rangeOfString:@"https://"];
+            NSRange end = [line rangeOfString:@"index.m3u8"];
+            if (start.location != NSNotFound && end.location != NSNotFound) {
+                return [line substringWithRange:NSMakeRange(start.location, NSMaxRange(end) - start.location)];
+            }
+        }
+    }
+    return nil;
+}
+
+static NSURL *YTMUDownloadsFolder(void) {
+    NSURL *docs = [[[NSFileManager defaultManager] URLsForDirectory:NSDocumentDirectory inDomains:NSUserDomainMask] lastObject];
+    return [docs URLByAppendingPathComponent:@"YTMusicUltimate"];
+}
+
+static UIViewController *YTMUTopViewController(UIViewController *vc) {
+    while (vc.presentedViewController) vc = vc.presentedViewController;
+    return vc;
+}
+
+@implementation YTMUPlaylistDownloader {
+    __weak YTMNowPlayingViewController *_playingVC;
+    NSInteger _total, _index, _saved, _skipped, _failed;
+    NSString *_lastManifest;
+    NSString *_playlistName;
+    NSMutableArray<NSString *> *_trackNames; // songs of this run that are on disk, in queue order
+    NSMutableSet<NSString *> *_seenIDs;
+    BOOL _cancelled;
+    MBProgressHUD *_hud;
+    FFMpegDownloader *_current;
+}
+
++ (instancetype)shared {
+    static YTMUPlaylistDownloader *instance;
+    static dispatch_once_t once;
+    dispatch_once(&once, ^{ instance = [[self alloc] init]; });
+    return instance;
+}
+
+#pragma mark - Entry point
+
+- (void)promptAndStartFromPlayingController:(YTMNowPlayingViewController *)playingVC {
+    if (_running) return;
+    _playingVC = playingVC;
+
+    UIAlertController *alert = [UIAlertController alertControllerWithTitle:@"Download playlist"
+        message:@"Downloads the current track and the next ones in the queue. Enter how many tracks to download (including this one) and, optionally, a playlist name to group them in the Downloads tab. Turn shuffle off and start from the first track to keep the original order. Audio will play briefly as each track is skipped."
+        preferredStyle:UIAlertControllerStyleAlert];
+    [alert addTextFieldWithConfigurationHandler:^(UITextField *field) {
+        field.keyboardType = UIKeyboardTypeNumberPad;
+        field.text = [NSString stringWithFormat:@"%ld", (long)kDefaultCount];
+    }];
+    [alert addTextFieldWithConfigurationHandler:^(UITextField *field) {
+        field.placeholder = @"Playlist name (empty = no playlist)";
+        field.autocapitalizationType = UITextAutocapitalizationTypeSentences;
+    }];
+    [alert addAction:[UIAlertAction actionWithTitle:@"Cancel" style:UIAlertActionStyleCancel handler:nil]];
+    [alert addAction:[UIAlertAction actionWithTitle:@"Start" style:UIAlertActionStyleDefault handler:^(UIAlertAction *a) {
+        NSInteger count = [alert.textFields.firstObject.text integerValue];
+        if (count < 1) count = 1;
+        if (count > kMaxCount) count = kMaxCount;
+        NSString *name = [alert.textFields.lastObject.text stringByTrimmingCharactersInSet:[NSCharacterSet whitespaceAndNewlineCharacterSet]];
+        [self startWithCount:count playlistName:name];
+    }]];
+    [YTMUTopViewController(playingVC) presentViewController:alert animated:YES completion:nil];
+}
+
+- (void)startWithCount:(NSInteger)count playlistName:(NSString *)playlistName {
+    _running = YES;
+    _playlistName = [playlistName copy];
+    _trackNames = [NSMutableArray array];
+    _cancelled = NO;
+    _total = count;
+    _index = _saved = _skipped = _failed = 0;
+    _lastManifest = nil;
+    _seenIDs = [NSMutableSet set];
+
+    _hud = [MBProgressHUD showHUDAddedTo:[UIApplication sharedApplication].keyWindow animated:YES];
+    _hud.mode = MBProgressHUDModeIndeterminate;
+    _hud.label.text = @"Preparing…";
+    [_hud.button setTitle:@"Cancel" forState:UIControlStateNormal];
+    [_hud.button addTarget:self action:@selector(cancel) forControlEvents:UIControlEventTouchUpInside];
+
+    [self pollForTrackUntil:[NSDate dateWithTimeIntervalSinceNow:kNextTrackTimeout]];
+}
+
+- (void)cancel {
+    _cancelled = YES;
+    dispatch_async(dispatch_get_global_queue(DISPATCH_QUEUE_PRIORITY_DEFAULT, 0), ^{
+        [MobileFFmpeg cancel];
+    });
+}
+
+#pragma mark - Queue stepping
+
+- (YTPlayerViewController *)playerVC {
+    YTMNowPlayingViewController *vc = _playingVC;
+    return vc.parentViewController.playerViewController;
+}
+
+// Waits until the player has loaded a *new* track (its manifest differs from the previous one).
+- (void)pollForTrackUntil:(NSDate *)deadline {
+    if (_cancelled || !_playingVC) { [self finishWithNote:_cancelled ? @"Cancelled." : @"Player was closed."]; return; }
+
+    YTPlayerViewController *player = [self playerVC];
+    YTPlayerResponse *response = player.playerResponse;
+    NSString *manifest = response.playerData.streamingData.hlsManifestURL;
+    NSString *videoID = player.contentVideoID;
+    BOOL ready = videoID.length && manifest.length && response.playerData.videoDetails.title.length
+              && ![manifest isEqualToString:_lastManifest];
+
+    if (ready) {
+        if ([_seenIDs containsObject:videoID]) { [self finishWithNote:@"Reached the end of the queue."]; return; }
+        [self downloadTrackWithPlayer:player videoID:videoID manifest:manifest];
+        return;
+    }
+
+    if ([deadline timeIntervalSinceNow] < 0) {
+        [self finishWithNote:_index == 0 ? @"No track is loaded yet. Start playing a track first." : @"No further track in the queue."];
+        return;
+    }
+
+    dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)(0.5 * NSEC_PER_SEC)), dispatch_get_main_queue(), ^{
+        [self pollForTrackUntil:deadline];
+    });
+}
+
+- (void)advance {
+    if (_cancelled || _index >= _total) { [self finishWithNote:_cancelled ? @"Cancelled." : nil]; return; }
+    [_playingVC didTapNextButton];
+    [self pollForTrackUntil:[NSDate dateWithTimeIntervalSinceNow:kNextTrackTimeout]];
+}
+
+#pragma mark - Single track
+
+- (void)downloadTrackWithPlayer:(YTPlayerViewController *)player videoID:(NSString *)videoID manifest:(NSString *)manifest {
+    YTIVideoDetails *details = player.playerResponse.playerData.videoDetails;
+    NSString *title = [details.title stringByReplacingOccurrencesOfString:@"/" withString:@""];
+    NSString *author = [details.author stringByReplacingOccurrencesOfString:@"/" withString:@""];
+    NSString *mediaName = [NSString stringWithFormat:@"%@ - %@", author, title];
+    NSInteger duration = (NSInteger)round(player.currentVideoTotalMediaTime);
+    NSString *thumbURL = ((YTIThumbnailDetails_Thumbnail *)[details.thumbnail.thumbnailsArray lastObject]).URL;
+
+    _lastManifest = manifest;
+    [_seenIDs addObject:videoID];
+    _index++;
+    _hud.label.text = [NSString stringWithFormat:@"Downloading %ld/%ld", (long)_index, (long)_total];
+    _hud.detailsLabel.text = mediaName;
+
+    NSURL *folder = YTMUDownloadsFolder();
+    NSURL *outputURL = [folder URLByAppendingPathComponent:[NSString stringWithFormat:@"%@.m4a", mediaName]];
+    if ([[NSFileManager defaultManager] fileExistsAtPath:outputURL.path]) {
+        _skipped++;
+        [self addTrackName:mediaName];
+        [self advance];
+        return;
+    }
+
+    dispatch_async(dispatch_get_global_queue(DISPATCH_QUEUE_PRIORITY_DEFAULT, 0), ^{
+        NSString *audioURL = YTMUAudioURLFromManifest(manifest);
+        dispatch_async(dispatch_get_main_queue(), ^{
+            if (self->_cancelled) { [self finishWithNote:@"Cancelled."]; return; }
+            if (audioURL.length == 0) { self->_failed++; [self advance]; return; }
+
+            FFMpegDownloader *ffmpeg = [[FFMpegDownloader alloc] init];
+            ffmpeg.quiet = YES;
+            ffmpeg.tempName = videoID;
+            ffmpeg.mediaName = mediaName;
+            ffmpeg.duration = duration;
+            ffmpeg.completion = ^(BOOL success) {
+                self->_current = nil;
+                if (success) {
+                    self->_saved++;
+                    [self addTrackName:mediaName];
+                    [self saveCoverFromURL:thumbURL named:mediaName];
+                } else if (!self->_cancelled) {
+                    self->_failed++;
+                }
+                [self advance];
+            };
+            self->_current = ffmpeg;
+            [ffmpeg downloadAudio:audioURL];
+        });
+    });
+}
+
+- (void)addTrackName:(NSString *)name {
+    if (![_trackNames containsObject:name]) [_trackNames addObject:name];
+}
+
+- (void)saveCoverFromURL:(NSString *)urlString named:(NSString *)mediaName {
+    if (urlString.length == 0) return;
+    dispatch_async(dispatch_get_global_queue(DISPATCH_QUEUE_PRIORITY_DEFAULT, 0), ^{
+        NSData *data = [NSData dataWithContentsOfURL:[NSURL URLWithString:urlString]];
+        if (!data) return;
+        NSURL *coverURL = [YTMUDownloadsFolder() URLByAppendingPathComponent:[NSString stringWithFormat:@"%@.png", mediaName]];
+        [data writeToURL:coverURL atomically:YES];
+    });
+}
+
+#pragma mark - Wrap up
+
+- (void)finishWithNote:(NSString *)note {
+    _running = NO;
+    [_hud hideAnimated:YES];
+    _hud = nil;
+    _current = nil;
+
+    BOOL savedPlaylist = NO;
+    if (!_cancelled && _playlistName.length && _trackNames.count) {
+        // Cover files are written asynchronously, so give them a moment before picking the playlist cover
+        NSString *name = _playlistName;
+        NSArray<NSString *> *tracks = [_trackNames copy];
+        savedPlaylist = YES;
+        dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)(1.5 * NSEC_PER_SEC)), dispatch_get_main_queue(), ^{
+            [YTMUPlaylistStore savePlaylistNamed:name tracks:tracks];
+            [[NSNotificationCenter defaultCenter] postNotificationName:@"ReloadDataNotification" object:nil];
+        });
+    }
+    [[NSNotificationCenter defaultCenter] postNotificationName:@"ReloadDataNotification" object:nil];
+
+    NSString *summary = [NSString stringWithFormat:@"Saved: %ld\nAlready downloaded: %ld\nFailed: %ld%@",
+                         (long)_saved, (long)_skipped, (long)_failed, note.length ? [@"\n\n" stringByAppendingString:note] : @""];
+    if (savedPlaylist) summary = [summary stringByAppendingFormat:@"\n\nPlaylist \"%@\" saved (%lu songs). Find it in the Downloads tab.", _playlistName, (unsigned long)_trackNames.count];
+    UIAlertController *alert = [UIAlertController alertControllerWithTitle:@"Playlist download finished" message:summary preferredStyle:UIAlertControllerStyleAlert];
+    [alert addAction:[UIAlertAction actionWithTitle:@"OK" style:UIAlertActionStyleDefault handler:nil]];
+    UIViewController *root = [UIApplication sharedApplication].keyWindow.rootViewController;
+    [YTMUTopViewController(root) presentViewController:alert animated:YES completion:nil];
+}
+
+@end
diff -ruN -x '*.zip' orig/YTMusicUltimate-main/Source/PlaylistStore.h /home/claude/YTMusicUltimate-main/Source/PlaylistStore.h
--- orig/YTMusicUltimate-main/Source/PlaylistStore.h	1970-01-01 00:00:00.000000000 +0000
+++ /home/claude/YTMusicUltimate-main/Source/PlaylistStore.h	2026-11-24 23:58:25.594996216 +0000
@@ -0,0 +1,19 @@
+#import <Foundation/Foundation.h>
+
+// Keeps track of downloaded playlists. Songs stay where they always were
+// (Documents/YTMusicUltimate/*.m4a); a playlist is just an ordered list of song names
+// stored as Documents/YTMusicUltimate/Playlists/<id>.json plus a cover <id>.png.
+@interface YTMUPlaylistStore : NSObject
++ (NSURL *)downloadsFolder;
++ (NSURL *)playlistsFolder;
+
+// Each entry: @{@"id", @"name", @"tracks" (existing songs only, in order), @"cover" (png path or @"")}
++ (NSArray<NSDictionary *> *)allPlaylists;
+
++ (void)savePlaylistNamed:(NSString *)name tracks:(NSArray<NSString *> *)tracks;
++ (void)deletePlaylistWithID:(NSString *)playlistID;
++ (void)renameTrack:(NSString *)oldName to:(NSString *)newName; // keeps playlists valid when a song is renamed
+
++ (NSURL *)audioURLForTrack:(NSString *)track; // .m4a or .mp3, nil if missing
++ (NSString *)coverPathForTrack:(NSString *)track; // nil if missing
+@end
diff -ruN -x '*.zip' orig/YTMusicUltimate-main/Source/PlaylistStore.m /home/claude/YTMusicUltimate-main/Source/PlaylistStore.m
--- orig/YTMusicUltimate-main/Source/PlaylistStore.m	1970-01-01 00:00:00.000000000 +0000
+++ /home/claude/YTMusicUltimate-main/Source/PlaylistStore.m	2026-11-24 23:58:25.600392294 +0000
@@ -0,0 +1,131 @@
+#import "PlaylistStore.h"
+
+static NSString *YTMUSafeName(NSString *name) {
+    NSMutableString *s = [[name stringByTrimmingCharactersInSet:[NSCharacterSet whitespaceAndNewlineCharacterSet]] mutableCopy];
+    for (NSString *bad in @[@"/", @"\\", @":", @"\n", @"\r"]) {
+        [s replaceOccurrencesOfString:bad withString:@"-" options:0 range:NSMakeRange(0, s.length)];
+    }
+    if (s.length > 80) [s deleteCharactersInRange:NSMakeRange(80, s.length - 80)];
+    return s.length ? [s copy] : @"Playlist";
+}
+
+@implementation YTMUPlaylistStore
+
++ (NSURL *)downloadsFolder {
+    NSURL *docs = [[[NSFileManager defaultManager] URLsForDirectory:NSDocumentDirectory inDomains:NSUserDomainMask] lastObject];
+    return [docs URLByAppendingPathComponent:@"YTMusicUltimate"];
+}
+
++ (NSURL *)playlistsFolder {
+    return [[self downloadsFolder] URLByAppendingPathComponent:@"Playlists"];
+}
+
++ (NSURL *)audioURLForTrack:(NSString *)track {
+    NSFileManager *fm = [NSFileManager defaultManager];
+    for (NSString *ext in @[@"m4a", @"mp3"]) {
+        NSURL *url = [[self downloadsFolder] URLByAppendingPathComponent:[NSString stringWithFormat:@"%@.%@", track, ext]];
+        if ([fm fileExistsAtPath:url.path]) return url;
+    }
+    return nil;
+}
+
++ (NSString *)coverPathForTrack:(NSString *)track {
+    NSURL *url = [[self downloadsFolder] URLByAppendingPathComponent:[NSString stringWithFormat:@"%@.png", track]];
+    return [[NSFileManager defaultManager] fileExistsAtPath:url.path] ? url.path : nil;
+}
+
++ (NSArray<NSString *> *)manifestFiles {
+    NSArray *files = [[NSFileManager defaultManager] contentsOfDirectoryAtPath:[self playlistsFolder].path error:nil] ?: @[];
+    NSMutableArray *result = [NSMutableArray array];
+    for (NSString *file in files) {
+        if ([file.pathExtension.lowercaseString isEqualToString:@"json"]) [result addObject:file];
+    }
+    return result;
+}
+
++ (NSDictionary *)readManifest:(NSString *)file {
+    NSData *data = [NSData dataWithContentsOfURL:[[self playlistsFolder] URLByAppendingPathComponent:file]];
+    id json = data ? [NSJSONSerialization JSONObjectWithData:data options:0 error:nil] : nil;
+    if (![json isKindOfClass:[NSDictionary class]]) return nil;
+    if (![json[@"name"] isKindOfClass:[NSString class]] || ![json[@"tracks"] isKindOfClass:[NSArray class]]) return nil;
+    return json;
+}
+
++ (NSArray<NSDictionary *> *)allPlaylists {
+    NSFileManager *fm = [NSFileManager defaultManager];
+    NSMutableArray<NSDictionary *> *result = [NSMutableArray array];
+
+    for (NSString *file in [self manifestFiles]) {
+        NSDictionary *json = [self readManifest:file];
+        if (!json) continue;
+
+        NSMutableArray<NSString *> *existing = [NSMutableArray array];
+        for (id track in json[@"tracks"]) {
+            if ([track isKindOfClass:[NSString class]] && [self audioURLForTrack:track]) [existing addObject:track];
+        }
+        if (existing.count == 0) continue;
+
+        NSString *playlistID = [file stringByDeletingPathExtension];
+        NSString *cover = [[[self playlistsFolder] URLByAppendingPathComponent:[playlistID stringByAppendingString:@".png"]] path];
+        if (![fm fileExistsAtPath:cover]) {
+            cover = nil;
+            for (NSString *track in existing) {
+                cover = [self coverPathForTrack:track];
+                if (cover) break;
+            }
+        }
+
+        [result addObject:@{@"id": playlistID, @"name": json[@"name"], @"tracks": existing, @"cover": cover ?: @""}];
+    }
+
+    [result sortUsingComparator:^NSComparisonResult(NSDictionary *a, NSDictionary *b) {
+        return [a[@"name"] caseInsensitiveCompare:b[@"name"]];
+    }];
+    return result;
+}
+
++ (void)savePlaylistNamed:(NSString *)name tracks:(NSArray<NSString *> *)tracks {
+    if (tracks.count == 0) return;
+    NSFileManager *fm = [NSFileManager defaultManager];
+    [fm createDirectoryAtURL:[self playlistsFolder] withIntermediateDirectories:YES attributes:nil error:nil];
+
+    NSString *playlistID = YTMUSafeName(name);
+    NSString *displayName = [name stringByTrimmingCharactersInSet:[NSCharacterSet whitespaceAndNewlineCharacterSet]];
+
+    NSData *data = [NSJSONSerialization dataWithJSONObject:@{@"name": displayName.length ? displayName : playlistID, @"tracks": tracks}
+                                                   options:NSJSONWritingPrettyPrinted error:nil];
+    [data writeToURL:[[self playlistsFolder] URLByAppendingPathComponent:[playlistID stringByAppendingString:@".json"]] atomically:YES];
+
+    // The playlist cover is the cover of its first track that has one (copied, so it survives deleting the song)
+    NSURL *coverDest = [[self playlistsFolder] URLByAppendingPathComponent:[playlistID stringByAppendingString:@".png"]];
+    [fm removeItemAtURL:coverDest error:nil];
+    for (NSString *track in tracks) {
+        NSString *cover = [self coverPathForTrack:track];
+        if (cover) {
+            [fm copyItemAtURL:[NSURL fileURLWithPath:cover] toURL:coverDest error:nil];
+            break;
+        }
+    }
+}
+
++ (void)deletePlaylistWithID:(NSString *)playlistID {
+    NSFileManager *fm = [NSFileManager defaultManager];
+    [fm removeItemAtURL:[[self playlistsFolder] URLByAppendingPathComponent:[playlistID stringByAppendingString:@".json"]] error:nil];
+    [fm removeItemAtURL:[[self playlistsFolder] URLByAppendingPathComponent:[playlistID stringByAppendingString:@".png"]] error:nil];
+}
+
++ (void)renameTrack:(NSString *)oldName to:(NSString *)newName {
+    for (NSString *file in [self manifestFiles]) {
+        NSDictionary *json = [self readManifest:file];
+        if (!json || ![json[@"tracks"] containsObject:oldName]) continue;
+
+        NSMutableArray *tracks = [NSMutableArray array];
+        for (id track in json[@"tracks"]) {
+            [tracks addObject:[track isEqual:oldName] ? newName : track];
+        }
+        NSData *data = [NSJSONSerialization dataWithJSONObject:@{@"name": json[@"name"], @"tracks": tracks} options:NSJSONWritingPrettyPrinted error:nil];
+        [data writeToURL:[[self playlistsFolder] URLByAppendingPathComponent:file] atomically:YES];
+    }
+}
+
+@end
